name: Test Alert

# Run by hand (Actions → Test Alert → Run workflow) to check that a failed
# workflow reaches Telegram through notify-failures.yml. It always fails.
on:
  workflow_dispatch:

jobs:
  fail:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on purpose
        run: |
          echo "Intentional failure to test Telegram alerts."
          exit 1
