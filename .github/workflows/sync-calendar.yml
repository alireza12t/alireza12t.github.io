name: Sync Calendar Availability

on:
  schedule:
    # Daily at 11:15 UTC (7:15 AM Toronto in summer), so new calendar events
    # are blocked on the booking page within a day. Offset from the running
    # dashboard (10:00 UTC) so the two don't race when pushing.
    - cron: "15 11 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync calendar events
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ICS_CALENDAR_URLS: ${{ secrets.ICS_CALENDAR_URLS }}
        run: python scripts/sync_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add availabilities.json
          git diff --staged --quiet || git commit -m "chore: sync calendar availability [skip ci]"
          git pull --rebase origin master
          git push
