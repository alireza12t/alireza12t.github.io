name: Notify on Failure

# Posts to Telegram whenever one of the scheduled workflows fails, so a broken
# sync is noticed the same day instead of months later.
# Needs repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
on:
  workflow_run:
    workflows:
      - Sync Calendar Availability
      - Update Running Dashboard
      - Add Holiday
      - Tests
      - Test Alert
      - MonFrigo Health Check
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          # MonFrigo's own links, only for its health check: the server's
          # /health and its App Runner service. Public URLs, nothing secret.
          MONFRIGO_HEALTH_URL: ${{ vars.MONFRIGO_HEALTH_URL }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set"
            exit 1
          fi
          text="🔴 ${WORKFLOW} ${CONCLUSION} on ${BRANCH}
          ${RUN_URL}"
          if [ "$WORKFLOW" = "MonFrigo Health Check" ]; then
            if [ -n "$MONFRIGO_HEALTH_URL" ]; then
              text="${text}
          Health: ${MONFRIGO_HEALTH_URL}"
            fi
            text="${text}
          App Runner: https://us-east-1.console.aws.amazon.com/apprunner/home?region=us-east-1#/services"
          fi
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" > /dev/null
