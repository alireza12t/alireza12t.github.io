        :root {

            --accent: #FDB813;
            --shadow: 0 4px 14px rgba(27, 58, 107, 0.08);

            :root {

                --muted: #A0B1C5;
                --border: #3A4F6E;
                --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 56px 16px 40px;
            -webkit-font-smoothing: antialiased;
        }
        main { width: 100%; max-width: 520px; text-align: center; }
        .avatar {
            width: 104px; height: 104px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            margin-bottom: 16px;
        }
        h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
        .bio { color: var(--muted); font-size: 0.95rem; margin: 6px 0 32px; line-height: 1.45; }
        ul { list-style: none; display: grid; gap: 14px; }
        a.link {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            color: var(--text);
            text-decoration: none;
            text-align: left;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        a.link:hover, a.link:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
        a.link:active { transform: scale(0.98); }
        .icon {
            flex: 0 0 44px; height: 44px;
            border-radius: 12px;
            display: grid; place-items: center;
            background: var(--bg);
        }
        .icon svg { width: 22px; height: 22px; fill: currentColor; }
        .featured .icon { background: var(--accent); color: #0F1F3D; }
        .app-icon { width: 44px; border-radius: 10px; object-fit: cover; }
        .label { flex: 1; min-width: 0; }
        .label strong { display: block; font-size: 1rem; font-weight: 600; }
        .label span { display: block; font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
        .arrow { color: var(--muted); font-size: 1.1rem; }
        footer { margin-top: 36px; font-size: 0.75rem; color: var(--muted); }
